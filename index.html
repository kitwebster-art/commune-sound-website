      <section id="join" class="signup-hero" aria-label="Join Commune Sound future dates list">
        <form
          class="signup-form"
          aria-label="Join the Commune Sound mailing list"
          action="https://kitwebster.us2.list-manage.com/subscribe/post?u=2ffca6b3b50c609d67f7c8e4a&amp;id=1b5918783a&amp;f_id=0048c7e3f0"
          method="post"
          data-mailchimp-ajax="true"
        >
          <p class="form-note">Ticket links, future dates and occasional Commune Sound updates.</p>
          <input type="hidden" name="EMAILTYPE" value="html">
          <input type="hidden" name="mc_signupsource" value="commune_sound_website">
          <input type="hidden" name="tags" value="1841991">
          <label>
            <span>First name</span>
            <input type="text" name="FNAME" autocomplete="given-name">
          </label>
          <label>
            <span>Email</span>
            <input type="email" name="EMAIL" autocomplete="email" required>
          </label>
          <div class="mailchimp-honeypot" aria-hidden="true">
            <input type="text" name="b_2ffca6b3b50c609d67f7c8e4a_1b5918783a" tabindex="-1" value="">
          </div>
          <button class="button primary" type="submit">Join Commune Sound</button>
          <p class="form-status" role="status" aria-live="polite"></p>
          <p class="privacy-note">Unsubscribe anytime.</p>
        </form>

      </footer>
    </main>
    <script>
      (() => {
        const form = document.querySelector('[data-mailchimp-ajax="true"]');
        if (!form) return;

        const button = form.querySelector('button[type="submit"]');
        const status = form.querySelector('.form-status');

        const setStatus = (message, state = '') => {
          status.textContent = message;
          status.dataset.state = state;
        };

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          setStatus('Joining...', 'loading');
          button.disabled = true;

          const callbackName = `communeMailchimp${Date.now()}`;
          const data = new FormData(form);
          const endpoint = form.action.replace('/post?', '/post-json?');
          const params = new URLSearchParams(data);
          params.set('c', callbackName);

          const script = document.createElement('script');
          let finished = false;

          const cleanup = () => {
            delete window[callbackName];
            script.remove();
          };

          window[callbackName] = (response) => {
            finished = true;
            button.disabled = false;
            cleanup();

            const message = String(response.msg || '').replace(/<[^>]*>/g, ' ');
            if (response.result === 'success' || message.toLowerCase().includes('already subscribed')) {
              form.reset();
              setStatus("You're on the Commune Sound list.", 'success');
              return;
            }

            setStatus(message || 'Something went wrong. Please try again.', 'error');
          };

          script.onerror = () => {
            if (finished) return;
            finished = true;
            button.disabled = false;
            cleanup();
            setStatus('Signup failed. Please try again.', 'error');
          };

          script.src = `${endpoint}&${params.toString()}`;
          document.body.appendChild(script);
        });
      })();
    </script>
